
name: Build AuraX Music Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            make \
            cmake \
            git \
            curl \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libopus-dev \
            libcurl4-openssl-dev \
            ffmpeg

      - name: Build D++
        run: |
          git clone --depth 1 \
            https://github.com/brainboxdotcc/DPP.git \
            /tmp/DPP

          cmake -S /tmp/DPP -B /tmp/DPP/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDPP_BUILD_TEST=OFF \
            -DDPP_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local

          cmake --build /tmp/DPP/build --parallel 2

          sudo cmake --install /tmp/DPP/build

          sudo ldconfig

      - name: Verify D++
        run: |
          test -f /usr/local/include/dpp/dpp.h

          echo "DPP libraries:"
          find /usr/local/lib -name "libdpp.so*"

          ldconfig -p | grep dpp

      - name: Build Bot
        run: |
          make clean
          make

      - name: Bundle DPP Library
        run: |
          mkdir -p dist

          cp aurax_music dist/

          cp -P /usr/local/lib/libdpp.so* dist/

          echo "Bundled files:"
          ls -lh dist/

      - name: Verify Executable
        run: |
          file dist/aurax_music

          echo "Checking dependencies:"
          ldd dist/aurax_music

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurax-music-linux
          path: dist/
          if-no-files-found: error
